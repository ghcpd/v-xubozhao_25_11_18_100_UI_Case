<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Bug Demo - Problematic Version</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 id="page-title">Dashboard</h1>
            <button id="action-button" class="btn-primary">Create New</button>
        </header>

        <main>
            <section class="form-section">
                <h2>User Input Form</h2>
                <form id="user-form">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" placeholder="Enter your username" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Enter your email" class="form-control">
                    </div>
                    <button type="button" id="open-modal-btn" class="btn-secondary">Submit</button>
                </form>
            </section>

            <section class="theme-toggle">
                <label>
                    <input type="checkbox" id="theme-toggle">
                    <span>Dark Mode</span>
                </label>
            </section>
        </main>

        <!-- Modal Dialog -->
        <div id="modal" class="modal hidden">
            <div class="modal-content">
                <h2>Confirmation</h2>
                <p>Your form has been submitted successfully!</p>
                <button id="close-modal-btn" class="btn-primary">Close</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
